# Linux / Amethyst is the supported product and CI target.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, amethyst-main, codex/amethyst-linux-integration]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-amethyst:
    name: Linux / Amethyst build and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out houseCARL-Amethyst
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pinned native-tool downloads
        uses: actions/cache@v6
        with:
          path: dist/vcpkg-downloads
          key: linux-tools-${{ runner.os }}-${{ hashFiles('scripts/native-tools.lock.json', 'scripts/vcpkg-linux-tools.json') }}

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tools-18 cmake ninja-build zip unzip curl tar

      - name: Check out the tested Amethyst filegraph source
        uses: actions/checkout@v7
        with:
          repository: ChrisDKN/Amethyst-Mod-Manager
          ref: edde06e518c0a3ca5ba47a8bbf065c4ecc4a8f92
          path: _ci/amethyst-filegraph-source

      - name: Build Amethyst's pinned native filegraph
        working-directory: _ci/amethyst-filegraph-source
        run: |
          native/amethyst_filegraph/build.sh
          test -s src/amethyst_filegraph.abi3.so
          echo "AMETHYST_FILEGRAPH_EXTENSION=$GITHUB_WORKSPACE/_ci/amethyst-filegraph-source/src/amethyst_filegraph.abi3.so" >> "$GITHUB_ENV"

      - name: Build pinned Caprica and Champollion
        run: python3 scripts/build-linux-tools.py

      - name: Check out the schema-10 Amethyst filegraph source
        uses: actions/checkout@v7
        with:
          repository: ChrisDKN/Amethyst-Mod-Manager
          ref: abeae84afce940c6819f80c1cd4e6e51db2e935d
          path: _ci/amethyst-filegraph-schema10-source

      - name: Build Amethyst's pinned schema-10 filegraph
        working-directory: _ci/amethyst-filegraph-schema10-source
        run: |
          native/amethyst_filegraph/build.sh
          test -s src/amethyst_filegraph.abi3.so
          echo "AMETHYST_FILEGRAPH_EXTENSION_SCHEMA10=$GITHUB_WORKSPACE/_ci/amethyst-filegraph-schema10-source/src/amethyst_filegraph.abi3.so" >> "$GITHUB_ENV"

      - name: Check out the schema-10/rules-15 Amethyst filegraph source
        uses: actions/checkout@v7
        with:
          repository: ChrisDKN/Amethyst-Mod-Manager
          ref: 7de35eaf0c7191defa7aee33d61452ddf73f7da3
          path: _ci/amethyst-filegraph-rules15-source

      - name: Build Amethyst's pinned rules-15 filegraph
        working-directory: _ci/amethyst-filegraph-rules15-source
        run: |
          native/amethyst_filegraph/build.sh
          test -s src/amethyst_filegraph.abi3.so
          echo "AMETHYST_FILEGRAPH_EXTENSION_SCHEMA10_RULES15=$GITHUB_WORKSPACE/_ci/amethyst-filegraph-rules15-source/src/amethyst_filegraph.abi3.so" >> "$GITHUB_ENV"

      - name: Check out the schema-10/rules-19 Amethyst filegraph source
        uses: actions/checkout@v7
        with:
          repository: ChrisDKN/Amethyst-Mod-Manager
          ref: 8ac86bdb9bc6f32b5c49eae69890ae96e4f16943
          path: _ci/amethyst-filegraph-rules19-source

      - name: Build Amethyst's pinned rules-19 filegraph
        working-directory: _ci/amethyst-filegraph-rules19-source
        run: |
          native/amethyst_filegraph/build.sh
          test -s src/amethyst_filegraph.abi3.so
          echo "AMETHYST_FILEGRAPH_EXTENSION_SCHEMA10_RULES19=$GITHUB_WORKSPACE/_ci/amethyst-filegraph-rules19-source/src/amethyst_filegraph.abi3.so" >> "$GITHUB_ENV"

      - name: Build the whole solution (Release)
        run: dotnet build housecarl.sln --configuration Release

      - name: Tests — Linux / Amethyst suite, with native tools
        run: dotnet test src/housecarl-mcp-tests --configuration Release --no-build --logger "trx;LogFileName=linux-amethyst.trx"

      - name: Tests — Linux installer and package
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build and start the Linux release archive
        run: |
          scripts/build-linux-base.sh
          pwsh -File scripts/generate-notices.ps1 -PublishDir dist/linux-base/server -Check
          python3 scripts/package-linux.py
          python3 scripts/probes/check_linux_package.py dist/housecarl-amethyst-linux-x64.tar.gz

      - name: Upload Linux test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-amethyst-test-results
          path: src/housecarl-mcp-tests/TestResults/**/linux-amethyst.trx
          if-no-files-found: ignore
