name: Amethyst compatibility experiment

on:
  pull_request:
    paths:
      - .github/workflows/amethyst-compatibility.yml
      - scripts/probes/*compatibility*
      - scripts/tests/test_amethyst_compatibility.py
  workflow_dispatch:
    inputs:
      amethyst_ref:
        description: Amethyst tag or commit to compare with the released reader baseline
        required: true
        default: main

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: schema9-rules13
            ref: edde06e518c0a3ca5ba47a8bbf065c4ecc4a8f92
            extension: amethyst_filegraph.abi3.so
          - label: schema10-rules14
            ref: abeae84afce940c6819f80c1cd4e6e51db2e935d
            extension: amethyst_filegraph_schema10.abi3.so
          - label: schema10-rules15
            ref: 7de35eaf0c7191defa7aee33d61452ddf73f7da3
            extension: amethyst_filegraph_schema10_rules15.abi3.so
          - label: candidate
            ref: ${{ inputs.amethyst_ref || 'v2.6.3' }}
            extension: candidate
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ChrisDKN/Amethyst-Mod-Manager
          ref: ${{ matrix.ref }}
          path: _compat/amethyst
          persist-credentials: false
      - name: Download and verify the fixed reader baseline
        run: |
          mkdir -p _compat/baseline
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 180 \
            --output _compat/baseline/package.tar.gz \
            https://github.com/ni1by2/houseCARL-Amethyst/releases/download/v2.1.3/housecarl-amethyst-linux-x64.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, tarfile
          root = Path('_compat/baseline')
          archive = root / 'package.tar.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'dd8a71f39f8b6e5f14c7e742f8f90a043ec09bd69dcdeae39ecd7d5c787ec7b9'
          with tarfile.open(archive) as package:
              package.extractall(root, filter='data')
          PY
      - name: Build the supplied producer component
        if: matrix.extension == 'candidate'
        run: cargo build --manifest-path _compat/amethyst/native/amethyst_filegraph/Cargo.toml --release --locked --target-dir _compat/native
      - name: Build the isolated Python/runtime environment
        run: docker build -t housecarl-amethyst-compatibility -f scripts/probes/amethyst-compatibility.Dockerfile scripts/probes
      - name: Compare producer, native readers and packaged MCP admission
        env:
          PRODUCER_EXTENSION: ${{ matrix.extension }}
          REPORT_LABEL: ${{ matrix.label }}
        run: |
          if [ "$PRODUCER_EXTENSION" = candidate ]; then
            producer="$PWD/_compat/native/release/libamethyst_filegraph.so"
          else
            producer="$PWD/_compat/baseline/server/$PRODUCER_EXTENSION"
          fi
          python3 scripts/probes/run_amethyst_compatibility.py \
            --source _compat/amethyst --producer-extension "$producer" \
            --server _compat/baseline/server --output "_compat/report-$REPORT_LABEL"
      - name: Preserve reports even when the comparison fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amethyst-compatibility-${{ matrix.label }}
          path: _compat/report-*/
          if-no-files-found: warn
